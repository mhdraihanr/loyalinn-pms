version: "3.8"

services:
  waha:
    image: devlikeapro/waha
    container_name: waha_server
    # Port Host 3001 mengarah ke Port Container 3000
    ports:
      - "3001:3000"
    environment:
      # Kredensial untuk Dashboard / Swagger UI
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin123

      # Kredensial API WAHA (sama dengan di .env.local kamu)
      - WHATSAPP_API_KEY=raihan-secret-key
      # NOWEB + store membuat endpoint chats/messages lebih stabil untuk inbox history.
      # Setelah mengganti engine dari WEBJS, backup/hapus data session lama lalu scan QR ulang.
      - WHATSAPP_DEFAULT_ENGINE=NOWEB

      # Global webhook agar event inbound langsung dikirim ke Next.js webhook route
      # host.docker.internal digunakan karena WAHA berjalan di container
      - WHATSAPP_HOOK_URL=http://host.docker.internal:3000/api/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=message.any
    volumes:
      # Menyimpan session dan NOWEB store chats/messages agar history tetap tersedia
      - ./.waha_sessions:/app/.sessions
    # Opsi ini membuat WAHA selalu auto-start selama Docker menyala!
    restart: always
